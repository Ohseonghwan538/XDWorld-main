<!doctype html>
<html>
<meta charset='utf-8'>
<head>
	<title></title>
	<link rel='stylesheet' href='./css/style.css'>
	<link rel="icon" href="./data/favicon.ico" type="image/x-icon">
</head>
<body>
	<div id='map'></div>
	<div class="map-control-panel">
		<span>1. Click object </span>
		<br>
		<span>2. Drag the cross button to move the object </span>
		<input type="button" id="moving" value="+" onclick="">
	</div>
	<script src="./engine/XDWorldEM.js" defer></script>
	<script src="./js/module.js" defer></script>
	<!-- UI 마우스오버 및 리사이즈 스크립트 -->
	<script>
		function mouseOverInterface(_isOver) {
			if (typeof Module == "object") {
				Module.XDIsMouseOverDiv(_isOver);
			}
		}
		window.onresize = function (e) {
			if (typeof Module == 'object' && typeof Module.Resize == 'function') {
				Module.Resize(window.innerWidth, window.innerHeight);
				Module.XDRenderData();
			}
		};
	</script>
	<!-- 레이어 및 객체를 제어하는 메인 로직 (ES6 Module 필수) -->
	<script type="module" src="./js/main.js"></script>
</body>
</html>
